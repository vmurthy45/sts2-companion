name: Update game data

# Spire Codex re-extracts every Slay the Spire 2 patch (main and public-beta).
# Check every 3 hours; commit only when the extracted data actually changed.
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build data bundles
        run: python3 tools/build_data.py
      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- data; then
            echo "No game data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "spire-data-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            V=$(python3 -c "import json;m=json.load(open('data/meta.json'));print(f\"main {m['main']['version']} / beta {m['beta']['version']}\")")
            git add data
            git commit -m "Game data: $V"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
